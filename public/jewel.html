<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dizrupt Jewels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #06050a;
  --panel: #0d0a15;
  --panel-lit: #15101f;
  --line: rgba(168, 132, 255, .16);
  --line-lit: rgba(168, 132, 255, .38);
  --violet: #8b5cf6;
  --violet-lit: #c084fc;
  --violet-deep: #3b1178;
  --white: #fff;
  --muted: #978ead;
  --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --body: "Inter", ui-sans-serif, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--white);
  font: 400 15px/1.5 var(--body);
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(70vw 60vh at 78% -10%, rgba(139, 92, 246, .18), transparent 65%),
    radial-gradient(50vw 50vh at 0% 110%, rgba(59, 17, 120, .35), transparent 60%);
  pointer-events: none;
}
button, input { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--violet-lit); outline-offset: 2px; }

.top {
  display: flex; align-items: baseline; gap: 14px;
  padding: 22px 28px 18px; border-bottom: 1px solid var(--line);
}
.mark { font: 700 22px/1 var(--display); letter-spacing: -.03em; }
.mark span { color: var(--violet-lit); }
.top-sub { font: 500 11px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 13px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--panel); font: 500 12px/1 var(--mono); color: var(--muted);
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); transition: background .2s; }
.dot.ok { background: var(--violet-lit); box-shadow: 0 0 10px var(--violet); }

.work { display: grid; grid-template-columns: 330px 1fr; height: calc(100% - 63px); }
.rail {
  border-right: 1px solid var(--line); padding: 22px 20px; overflow-y: auto;
  display: flex; flex-direction: column; gap: 18px;
}
.stage { padding: 24px 28px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }

.kinds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel); }
.kinds button {
  padding: 9px 4px; border: 0; border-radius: 8px; background: transparent;
  color: var(--muted); font: 500 11px/1 var(--body); cursor: pointer;
  transition: background .18s, color .18s;
}
.kinds button:hover { color: var(--white); }
.kinds button[aria-pressed="true"] { background: linear-gradient(160deg, var(--violet), var(--violet-deep)); color: var(--white); }
.kinds-note { margin: -10px 0 0; font-size: 11px; color: var(--muted); text-align: center; min-height: 1.4em; }

.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 18px; }
.step { display: flex; flex-direction: column; gap: 9px; position: relative; }
.step-head { display: flex; align-items: center; gap: 10px; }
.step-n {
  display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
  border: 1px solid var(--line-lit); font: 500 11px/1 var(--mono); color: var(--violet-lit); flex: none;
  transition: background .2s, color .2s, border-color .2s;
}
.step.done .step-n { background: var(--violet); border-color: var(--violet); color: var(--white); }
.step-label { font: 500 14px/1 var(--body); }
.drop {
  position: relative; aspect-ratio: 4 / 3;
  border: 1px dashed var(--line-lit); border-radius: 13px;
  background: linear-gradient(180deg, var(--panel-lit), var(--panel));
  display: grid; place-items: center; cursor: pointer; overflow: hidden;
  transition: border-color .18s, background .18s;
}
.drop:hover, .drop.over { border-color: var(--violet-lit); background: var(--panel-lit); }
.drop.filled { border-style: solid; border-color: var(--line); }
.cue { text-align: center; padding: 12px; pointer-events: none; font-size: 12px; color: var(--muted); line-height: 1.45; }
.thumb {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
  opacity: 0; transition: opacity .25s;
  background: repeating-conic-gradient(#1b1526 0% 25%, #120e1c 0% 50%) 50% / 16px 16px;
}
.drop.filled .thumb { opacity: 1; }
.drop.filled .cue { display: none; }
.clear {
  position: absolute; top: 8px; right: 8px; width: 26px; height: 26px;
  border: 0; border-radius: 50%; background: rgba(6, 5, 10, .8); color: var(--white);
  cursor: pointer; line-height: 1; display: none; z-index: 1;
}
.drop.filled + .clear { display: block; }

.act {
  width: 100%; padding: 16px; border: 0; border-radius: 12px;
  background: linear-gradient(100deg, var(--violet-deep), var(--violet) 45%, var(--violet-lit));
  background-size: 200% 100%; color: var(--white); font: 600 15px/1 var(--body);
  cursor: pointer; transition: background-position .5s, opacity .2s;
}
.act:hover { background-position: 100% 0; }
.act:disabled { opacity: .35; cursor: not-allowed; }
.note { margin: 0; font-size: 11px; color: var(--muted); text-align: center; }

.stage-bar { display: flex; align-items: center; gap: 12px; min-height: 30px; flex-wrap: wrap; }
.status { font: 400 12px/1.5 var(--mono); color: var(--muted); max-width: 100%; }
.status.bad { color: #f0567c; }
.status b { color: var(--violet-lit); font-weight: 500; }
.stage-actions { margin-left: auto; display: flex; gap: 8px; }
.ghost {
  padding: 8px 13px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel);
  color: var(--white); font-size: 12px; cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center;
}
.ghost:hover { border-color: var(--line-lit); background: var(--panel-lit); }

.canvas {
  flex: 1; min-height: 320px; border: 1px solid var(--line); border-radius: 16px;
  background: linear-gradient(180deg, var(--panel-lit), var(--panel));
  display: grid; place-items: center; overflow: hidden; position: relative;
}
#out { max-width: 100%; max-height: 100%; display: block; }

.empty { text-align: center; padding: 40px 20px; display: grid; gap: 14px; justify-items: center; }
.empty-seam { width: 1px; height: 88px; background: linear-gradient(180deg, transparent, var(--violet-lit), transparent); }
.empty h2 { font: 300 30px/1.15 var(--display); letter-spacing: -.02em; margin: 0; max-width: 17ch; }
.empty p { margin: 0; color: var(--muted); font-size: 13px; max-width: 36ch; }

.working { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(6, 5, 10, .72); }
.prog { width: min(320px, 64%); display: grid; gap: 11px; }
.track { height: 3px; border-radius: 2px; background: rgba(168, 132, 255, .18); overflow: hidden; }
.fill { height: 100%; width: 0; border-radius: 2px; background: linear-gradient(90deg, var(--violet), var(--violet-lit)); box-shadow: 0 0 12px rgba(192, 132, 252, .6); transition: width .3s linear; }
.meta { display: flex; justify-content: space-between; font: 500 10px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }

@media (max-width: 860px) {
  .work { grid-template-columns: 1fr; height: auto; }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); }
  .canvas { min-height: 55vh; }
}
@media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
</style>
</head>
<body>

<header class="top">
  <div class="mark">Dizrupt<span>.</span></div>
  <div class="top-sub">Jewels</div>
  <div class="top-right">
    <span class="pill"><i class="dot" id="kindDot"></i><span id="kindText">no piece yet</span></span>
  </div>
</header>

<main class="work">
  <aside class="rail">
    <div class="kinds" role="group" aria-label="What kind of piece">
      <button type="button" data-kind="necklace" aria-pressed="true">Necklace</button>
      <button type="button" data-kind="earrings" aria-pressed="false">Earrings</button>
      <button type="button" data-kind="ring" aria-pressed="false">Ring</button>
      <button type="button" data-kind="bracelet" aria-pressed="false">Bracelet</button>
    </div>
    <p class="kinds-note" id="kindsNote">Set automatically from the product photo. Change it if it guesses wrong.</p>

    <ol class="steps">
      <li class="step" id="stepPiece">
        <div class="step-head"><span class="step-n">1</span><span class="step-label" id="pieceLabel">Add the piece</span></div>
        <div class="drop" id="dropPiece" tabindex="0" role="button" aria-label="Add the piece">
          <img class="thumb" id="thumbPiece" alt="">
          <span class="cue" id="pieceCue">Drop, click or paste a product shot on a plain background</span>
        </div>
        <button class="clear" data-clear="piece" aria-label="Remove the piece">✕</button>
      </li>
      <li class="step" id="stepPhoto">
        <div class="step-head"><span class="step-n">2</span><span class="step-label" id="photoLabel">Add your photo</span></div>
        <div class="drop" id="dropPhoto" tabindex="0" role="button" aria-label="Add your photo">
          <img class="thumb" id="thumbPhoto" alt="">
          <span class="cue" id="photoCue">Drop, click or paste a photo of the person</span>
        </div>
        <button class="clear" data-clear="photo" aria-label="Remove your photo">✕</button>
      </li>
    </ol>

    <button class="act" id="place" disabled>Add both images to start</button>
    <p class="note">Takes about a minute.</p>
  </aside>

  <section class="stage">
    <div class="stage-bar">
      <span class="status" id="status">Ready</span>
      <div class="stage-actions">
        <a class="ghost" id="open" hidden target="_blank" rel="noopener">Open image ↗</a>
      </div>
    </div>
    <div class="canvas" id="canvas"></div>
  </section>
</main>

<script type="module">
const $ = (id) => document.getElementById(id)

const COPY = {
  necklace: { label: 'Add the necklace', photo: 'Add your photo', photoCue: 'Head and shoulders, collar visible' },
  earrings: { label: 'Add the earring', photo: 'Add your photo', photoCue: 'A face-on photo works best' },
  ring: { label: 'Add the ring', photo: 'Add a photo of your hand', photoCue: 'Palm down, fingers apart' },
  bracelet: { label: 'Add the bracelet', photo: 'Add a photo of your wrist', photoCue: 'Hand and wrist in frame' },
}

const state = { kind: 'necklace', photo: null, photoImg: null, piece: null, pieceFlat: null, result: null }

/* ---------- image plumbing ---------- */
const loadImage = (src) => new Promise((resolve, reject) => {
  const img = new Image()
  img.onload = () => resolve(img)
  img.onerror = () => reject(new Error('Could not read that image'))
  img.src = src
})
const readAsDataURL = (file) => new Promise((resolve, reject) => {
  const r = new FileReader()
  r.onload = () => resolve(r.result)
  r.onerror = () => reject(new Error('Could not read that file'))
  r.readAsDataURL(file)
})
const canvasOf = (w, h) => Object.assign(document.createElement('canvas'), { width: w, height: h })

const shrink = async (file) => {
  if (file.type === 'image/png' && file.size < 2e6) return readAsDataURL(file)
  const img = await loadImage(URL.createObjectURL(file))
  const scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight))
  const c = canvasOf(Math.round(img.naturalWidth * scale), Math.round(img.naturalHeight * scale))
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height)
  URL.revokeObjectURL(img.src)
  return c.toDataURL('image/jpeg', 0.92)
}

/* ---------- strip the backdrop off the product ---------- */
// Learn the backdrop's palette from the border, flood inwards through matching
// pixels only, then sweep up pockets the flood could not reach — the hole inside
// a necklace loop is backdrop too, and left opaque it lands on the wearer.
const cutout = async (src) => {
  const img = await loadImage(src)
  const w = img.naturalWidth
  const h = img.naturalHeight
  const c = canvasOf(w, h)
  const ctx = c.getContext('2d', { willReadFrequently: true })
  ctx.drawImage(img, 0, 0)
  const image = ctx.getImageData(0, 0, w, h)
  const px = image.data

  const key = (p) => ((px[p] >> 2) << 12) | ((px[p + 1] >> 2) << 6) | (px[p + 2] >> 2)
  const palette = new Uint8Array(64 * 64 * 64)
  const learn = (p) => {
    const r = px[p] >> 2, g = px[p + 1] >> 2, b = px[p + 2] >> 2
    for (let dr = -1; dr <= 1; dr++) for (let dg = -1; dg <= 1; dg++) for (let db = -1; db <= 1; db++) {
      const rr = r + dr, gg = g + dg, bb = b + db
      if (rr < 0 || rr > 63 || gg < 0 || gg > 63 || bb < 0 || bb > 63) continue
      palette[(rr << 12) | (gg << 6) | bb] = 1
    }
  }
  for (let x = 0; x < w; x++) { learn(x * 4); learn(((h - 1) * w + x) * 4) }
  for (let y = 0; y < h; y++) { learn(y * w * 4); learn((y * w + w - 1) * 4) }

  const isBg = new Uint8Array(w * h)
  const stack = []
  const seed = (i) => { if (!isBg[i] && palette[key(i * 4)]) { isBg[i] = 1; stack.push(i) } }
  for (let x = 0; x < w; x++) { seed(x); seed((h - 1) * w + x) }
  for (let y = 0; y < h; y++) { seed(y * w); seed(y * w + w - 1) }
  while (stack.length) {
    const i = stack.pop()
    const x = i % w, y = (i / w) | 0
    if (x > 0) seed(i - 1)
    if (x < w - 1) seed(i + 1)
    if (y > 0) seed(i - w)
    if (y < h - 1) seed(i + w)
  }

  const MIN_HOLE = Math.max(64, Math.round(w * h * 0.002))
  const seen = new Uint8Array(w * h)
  for (let start = 0; start < isBg.length; start++) {
    if (isBg[start] || seen[start] || !palette[key(start * 4)]) continue
    const pocket = []
    const queue = [start]
    seen[start] = 1
    while (queue.length) {
      const i = queue.pop()
      pocket.push(i)
      const x = i % w, y = (i / w) | 0
      const step = (j) => { if (!seen[j] && !isBg[j] && palette[key(j * 4)]) { seen[j] = 1; queue.push(j) } }
      if (x > 0) step(i - 1)
      if (x < w - 1) step(i + 1)
      if (y > 0) step(i - w)
      if (y < h - 1) step(i + w)
    }
    if (pocket.length >= MIN_HOLE) for (const i of pocket) isBg[i] = 1
  }

  let removed = 0, minX = w, minY = h, maxX = -1, maxY = -1
  for (let i = 0; i < isBg.length; i++) {
    if (isBg[i]) { removed++; px[i * 4 + 3] = 0; continue }
    const x = i % w, y = (i / w) | 0
    if (x < minX) minX = x
    if (x > maxX) maxX = x
    if (y < minY) minY = y
    if (y > maxY) maxY = y
  }
  const share = removed / (w * h)
  const kept = w * h - removed
  const wide = maxX - minX > w * 0.02 && maxY - minY > h * 0.02
  if (share < 0.15 || share > 0.9995 || kept < 200 || !wide || maxX < 0) return null

  const m = Math.round(Math.max(maxX - minX, maxY - minY) * 0.03)
  const sx = Math.max(0, minX - m), sy = Math.max(0, minY - m)
  const sw = Math.min(w - sx, maxX - minX + 1 + m * 2)
  const sh = Math.min(h - sy, maxY - minY + 1 + m * 2)

  // Flat on white for the model, which renders alpha as black.
  ctx.putImageData(image, 0, 0)
  const flat = canvasOf(sw, sh)
  const f = flat.getContext('2d')
  f.fillStyle = '#fff'
  f.fillRect(0, 0, sw, sh)
  f.drawImage(c, sx, sy, sw, sh, 0, 0, sw, sh)

  // Knocked out, purely so the thumbnail shows what was stripped.
  for (let i = 0; i < isBg.length; i++) if (isBg[i]) px[i * 4 + 3] = 0
  ctx.putImageData(image, 0, 0)
  const cut = canvasOf(sw, sh)
  cut.getContext('2d').drawImage(c, sx, sy, sw, sh, 0, 0, sw, sh)

  return { flat: flat.toDataURL('image/jpeg', 0.95), cut: cut.toDataURL('image/png') }
}

// Ask for ~3.1 megapixels at the photo's own aspect ratio. Left to itself the
// API renders around 1024px, where a chain link has too few pixels to exist.
const renderSize = (img) => {
  const ratio = img.naturalWidth / img.naturalHeight
  const snap = (v) => Math.max(256, Math.min(3840, Math.round(v / 16) * 16))
  return `${snap(Math.sqrt(3.1e6 * ratio))}x${snap(Math.sqrt(3.1e6 / ratio))}`
}

/* ---------- status ---------- */
const fail = (message) => { $('status').className = 'status bad'; $('status').textContent = message }
const say = (html) => { $('status').className = 'status'; $('status').innerHTML = html }
const clearFail = () => { if ($('status').className.includes('bad')) say('Ready') }

let openUrl = null
const linkResult = (src) => {
  $('open').hidden = false
  fetch(src).then((r) => r.blob()).then((blob) => {
    if (openUrl) URL.revokeObjectURL(openUrl)
    openUrl = URL.createObjectURL(blob)
    $('open').href = openUrl
  }).catch(() => { $('open').href = src })
}

function emptyState() {
  const el = document.createElement('div')
  el.className = 'empty'
  el.innerHTML = `<div class="empty-seam"></div><h2>Try the piece on.</h2>
    <p>Add a product shot and a photo of the person. The kind of piece is worked out for you.</p>`
  return el
}

const working = (label, pct) => {
  let box = $('canvas').querySelector('.working')
  if (!box) {
    box = document.createElement('div')
    box.className = 'working'
    box.innerHTML = `<div class="prog"><div class="track"><div class="fill"></div></div>
      <div class="meta"><span class="phase"></span><span class="pc"></span></div></div>`
    $('canvas').replaceChildren(box)
  }
  box.querySelector('.fill').style.width = `${pct}%`
  box.querySelector('.phase').textContent = label
  box.querySelector('.pc').textContent = `${pct}%`
}

/* ---------- the kind of piece ---------- */
const setKind = (kind, automatic) => {
  state.kind = kind
  document.querySelectorAll('[data-kind]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.kind === kind)))
  const copy = COPY[kind]
  $('pieceLabel').textContent = copy.label
  $('photoLabel').textContent = copy.photo
  $('photoCue').textContent = copy.photoCue
  $('kindDot').className = 'dot ok'
  $('kindText').textContent = kind
  $('kindsNote').textContent = automatic
    ? `Read from your product photo. Change it if that is wrong.`
    : `Set by you.`
}

document.querySelectorAll('[data-kind]').forEach((btn) =>
  btn.addEventListener('click', () => setKind(btn.dataset.kind, false)))

const identify = async (image) => {
  $('kindDot').className = 'dot'
  $('kindText').textContent = 'reading piece'
  try {
    const res = await fetch('/api/identify', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ image }),
    })
    const data = await res.json()
    if (data.kind) return setKind(data.kind, true)
  } catch { /* fall through to whatever is already selected */ }
  $('kindDot').className = 'dot ok'
  $('kindText').textContent = state.kind
  $('kindsNote').textContent = 'Could not read the piece — pick the kind yourself.'
}

/* ---------- intake ---------- */
const setPiece = async (value) => {
  state.result = null
  $('dropPiece').classList.toggle('filled', Boolean(value))
  $('stepPiece').classList.toggle('done', Boolean(value))
  if (!value) {
    state.piece = state.pieceFlat = null
    $('thumbPiece').src = ''
    $('kindDot').className = 'dot'
    $('kindText').textContent = 'no piece yet'
    return sync()
  }
  const cut = await cutout(value)
  if (!cut) {
    state.piece = state.pieceFlat = null
    $('thumbPiece').src = value
    fail('Could not separate that piece from its backdrop. Use a product shot on a plain background.')
    return sync()
  }
  state.piece = cut.cut
  state.pieceFlat = cut.flat
  $('thumbPiece').src = cut.cut
  clearFail()
  sync()
  identify(cut.flat)
}

const setPhoto = async (value) => {
  state.result = null
  state.photo = value
  $('dropPhoto').classList.toggle('filled', Boolean(value))
  $('stepPhoto').classList.toggle('done', Boolean(value))
  $('thumbPhoto').src = value || ''
  state.photoImg = value ? await loadImage(value) : null
  sync()
}

for (const [dropId, set] of [['dropPiece', setPiece], ['dropPhoto', setPhoto]]) {
  const drop = $(dropId)
  const pick = Object.assign(document.createElement('input'), { type: 'file', accept: 'image/*' })
  const take = async (file) => {
    if (!file || !file.type.startsWith('image/')) return
    try { await set(await shrink(file)) } catch (e) { fail(e.message) }
  }
  pick.onchange = () => take(pick.files[0])
  drop.addEventListener('click', () => pick.click())
  drop.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick.click() } })
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over') })
  drop.addEventListener('dragleave', () => drop.classList.remove('over'))
  drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); take(e.dataTransfer.files[0]) })
}
document.querySelectorAll('[data-clear]').forEach((b) =>
  b.addEventListener('click', () => (b.dataset.clear === 'piece' ? setPiece(null) : setPhoto(null))))

window.addEventListener('paste', (e) => {
  const target = state.pieceFlat ? (state.photo ? null : setPhoto) : setPiece
  if (!target) return
  const file = [...e.clipboardData.files][0]
  if (file) shrink(file).then(target).catch((err) => fail(err.message))
})

/* ---------- run ---------- */
const sync = () => {
  const ready = Boolean(state.photo && state.pieceFlat)
  $('place').disabled = !ready
  $('place').textContent = ready ? (state.result ? 'Try again' : 'Try it on') : 'Add both images to start'
  if (!state.result && !$('canvas').querySelector('.empty')) $('canvas').replaceChildren(emptyState())
}

$('place').addEventListener('click', async () => {
  const t = Date.now()
  $('place').disabled = true
  clearFail()
  // One long blocking call with nothing to report, so the bar eases on elapsed
  // time rather than sitting at a number that looks like a hang.
  const tick = setInterval(() => {
    working('putting it on', Math.round(100 * (1 - Math.exp(-((Date.now() - t) / 1000) / 22))))
  }, 250)
  try {
    working('putting it on', 2)
    const res = await fetch('/api/run', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        mode: 'jewellery',
        kind: state.kind,
        size: renderSize(state.photoImg),
        inputs: { model_image: state.photo, garment_image: state.pieceFlat },
      }),
    })
    const data = await res.json().catch(() => ({ message: `HTTP ${res.status}` }))
    if (!res.ok || (typeof data.error === 'string' && data.error)) {
      throw new Error(data.message || data.error || `HTTP ${res.status}`)
    }
    const painted = (data.output || [])[0]
    if (!painted) throw new Error('The service returned no image.')

    state.result = painted
    const out = $('out') || Object.assign(document.createElement('img'), { id: 'out', alt: 'Try-on result' })
    out.src = painted
    $('canvas').replaceChildren(out)
    linkResult(painted)
    say(`<b>done</b> · ${((Date.now() - t) / 1000).toFixed(1)}s · ${state.kind}`)
  } catch (e) {
    $('canvas').replaceChildren(emptyState())
    fail(e.message)
  } finally {
    clearInterval(tick)
    $('place').disabled = !(state.photo && state.pieceFlat)
    $('place').textContent = state.result ? 'Try again' : 'Try it on'
  }
})

$('canvas').replaceChildren(emptyState())
sync()
</script>
</body>
</html>
