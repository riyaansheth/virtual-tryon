<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dizrupt Try-On</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #06050a;
  --panel: #0d0a15;
  --panel-lit: #15101f;
  --line: rgba(168, 132, 255, .16);
  --line-lit: rgba(168, 132, 255, .38);
  --violet: #8b5cf6;
  --violet-lit: #c084fc;
  --violet-deep: #3b1178;
  --white: #fff;
  --muted: #978ead;
  --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --body: "Inter", ui-sans-serif, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--white);
  font: 400 15px/1.5 var(--body);
  -webkit-font-smoothing: antialiased;
}
/* the seam motif: a violet meridian behind everything */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(70vw 60vh at 78% -10%, rgba(139, 92, 246, .18), transparent 65%),
    radial-gradient(50vw 50vh at 0% 110%, rgba(59, 17, 120, .35), transparent 60%);
  pointer-events: none;
}
button, input { font: inherit; color: inherit; }
/* Author display rules outrank the UA sheet's [hidden], so state it once here. */
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--violet-lit); outline-offset: 2px; }

/* ---------- header ---------- */
.top {
  position: relative;
  display: flex;
  align-items: baseline;
  gap: 14px;
  padding: 22px 28px 18px;
  border-bottom: 1px solid var(--line);
}
.mark { font: 700 22px/1 var(--display); letter-spacing: -.03em; }
.mark span { color: var(--violet-lit); }
.top-sub {
  font: 500 11px/1 var(--mono);
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--muted);
}
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 13px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--panel);
  font: 500 12px/1 var(--mono);
  color: var(--muted);
}
.pill b { color: var(--white); font-weight: 500; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--violet-lit); box-shadow: 0 0 10px var(--violet); }
.dot.bad { background: #f0567c; box-shadow: 0 0 10px rgba(240, 86, 124, .7); }

/* ---------- layout ---------- */
.work {
  position: relative;
  display: grid;
  grid-template-columns: 320px 1fr;
  height: calc(100% - 63px);
}
.rail {
  border-right: 1px solid var(--line);
  padding: 22px 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.stage {
  position: relative;
  padding: 24px 28px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  overflow-y: auto;
}

/* ---------- mode toggle ---------- */
.modes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--panel);
}
.modes button {
  padding: 9px 8px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  font: 500 12px/1 var(--body);
  cursor: pointer;
  transition: background .18s, color .18s;
}
.modes button:hover { color: var(--white); }
.modes button[aria-pressed="true"] {
  background: linear-gradient(160deg, var(--violet), var(--violet-deep));
  color: var(--white);
}

/* ---------- the two steps ---------- */
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 18px; }
.step { display: flex; flex-direction: column; gap: 9px; position: relative; }
.step-head { display: flex; align-items: center; gap: 10px; }
.step-n {
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1px solid var(--line-lit);
  font: 500 11px/1 var(--mono);
  color: var(--violet-lit);
  flex: none;
  transition: background .2s, color .2s, border-color .2s;
}
.step.done .step-n { background: var(--violet); border-color: var(--violet); color: var(--white); }
.step-label { font: 500 14px/1 var(--body); }
.drop {
  position: relative;
  aspect-ratio: 4 / 3;
  border: 1px dashed var(--line-lit);
  border-radius: 13px;
  background: linear-gradient(180deg, var(--panel-lit), var(--panel));
  display: grid;
  place-items: center;
  cursor: pointer;
  overflow: hidden;
  transition: border-color .18s, background .18s, transform .18s;
}
.drop:hover, .drop.over { border-color: var(--violet-lit); background: var(--panel-lit); }
.drop.over { transform: scale(1.015); }
.drop.filled { border-style: solid; border-color: var(--line); }
.cue { text-align: center; padding: 12px; pointer-events: none; font-size: 12px; color: var(--muted); line-height: 1.45; }
.thumb {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity .25s;
}
.drop.filled .thumb { opacity: 1; }
.drop.filled .cue { display: none; }
.clear {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 26px;
  height: 26px;
  border: 0;
  border-radius: 50%;
  background: rgba(6, 5, 10, .8);
  color: var(--white);
  cursor: pointer;
  line-height: 1;
  display: none;
  z-index: 1;
}
.drop.filled + .clear { display: block; }

/* ---------- generate ---------- */
.run {
  width: 100%;
  padding: 16px;
  border: 0;
  border-radius: 12px;
  background: linear-gradient(100deg, var(--violet-deep), var(--violet) 45%, var(--violet-lit));
  background-size: 200% 100%;
  color: var(--white);
  font: 600 15px/1 var(--body);
  cursor: pointer;
  transition: background-position .5s, opacity .2s;
}
.run:hover { background-position: 100% 0; }
.run:disabled { opacity: .35; cursor: not-allowed; }
.note { margin: 0; font-size: 11px; color: var(--muted); text-align: center; }

/* ---------- stage ---------- */
.stage-bar { display: flex; align-items: center; gap: 12px; min-height: 30px; flex-wrap: wrap; }
.status { font: 400 12px/1.5 var(--mono); color: var(--muted); max-width: 100%; }
.status.bad { color: #f0567c; }
.status b { color: var(--violet-lit); font-weight: 500; }
.stage-actions { margin-left: auto; display: flex; gap: 8px; }
.ghost {
  padding: 8px 13px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--panel);
  color: var(--white);
  font-size: 12px;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
}
.ghost:hover { border-color: var(--line-lit); background: var(--panel-lit); }

.canvas {
  flex: 1;
  min-height: 320px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: linear-gradient(180deg, var(--panel-lit), var(--panel));
  display: grid;
  place-items: center;
  overflow: hidden;
  position: relative;
}

.empty { text-align: center; padding: 40px 20px; display: grid; gap: 14px; justify-items: center; }
.empty-seam { width: 1px; height: 88px; background: linear-gradient(180deg, transparent, var(--violet-lit), transparent); }
.empty h2 { font: 300 30px/1.15 var(--display); letter-spacing: -.02em; margin: 0; max-width: 16ch; }
.empty p { margin: 0; color: var(--muted); font-size: 13px; max-width: 34ch; }

/* region picker */
.select {
  position: relative;
  width: min(100%, 620px);
  max-height: 100%;
  overflow: hidden;
  user-select: none;
  touch-action: none;
  cursor: crosshair;
  border-radius: 4px;
}
/* pointer-events off so the image can never become the drag target and start a
   native image-drag, which silently kills the pointer stream mid-gesture. */
.select img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  pointer-events: none;
  -webkit-user-drag: none;
}
.sel-box {
  position: absolute;
  border: 1px solid var(--violet-lit);
  border-radius: 2px;
  box-shadow: 0 0 0 9999px rgba(6, 5, 10, .58), 0 0 14px rgba(192, 132, 252, .45);
  pointer-events: none;
}
.sel-hint {
  position: absolute;
  left: 50%;
  bottom: 12px;
  transform: translateX(-50%);
  padding: 7px 12px;
  border-radius: 999px;
  background: rgba(6, 5, 10, .82);
  border: 1px solid var(--line);
  font: 500 10px/1 var(--mono);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
  pointer-events: none;
}

/* the mirror */
.compare {
  position: relative;
  max-width: 100%;
  max-height: 100%;
  width: min(100%, 620px);
  user-select: none;
  touch-action: none;
  cursor: ew-resize;
  --x: 50%;
}
.compare img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
/* The box is sized to the result, so the original almost never matches its
   aspect. Contain would letterbox it and let the result show through above and
   below; cover crops it to the same frame so the wipe stays aligned. */
.compare .before { object-fit: cover; clip-path: inset(0 calc(100% - var(--x)) 0 0); }
.seam {
  position: absolute;
  top: 0;
  bottom: 0;
  left: var(--x);
  width: 1px;
  background: var(--violet-lit);
  box-shadow: 0 0 16px 1px rgba(192, 132, 252, .55);
}
.grip {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 30px;
  height: 30px;
  transform: translate(-50%, -50%) rotate(45deg);
  border: 1px solid var(--violet-lit);
  border-radius: 7px;
  background: rgba(6, 5, 10, .8);
}
.tag {
  position: absolute;
  bottom: 10px;
  padding: 5px 9px;
  border-radius: 999px;
  background: rgba(6, 5, 10, .72);
  border: 1px solid var(--line);
  font: 500 10px/1 var(--mono);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
}
.tag.l { left: 10px; }
.tag.r { right: 10px; color: var(--violet-lit); }

.working { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(6, 5, 10, .72); }
.prog { width: min(320px, 64%); display: grid; gap: 11px; }
.track { height: 3px; border-radius: 2px; background: rgba(168, 132, 255, .18); overflow: hidden; }
.fill {
  height: 100%;
  width: 0;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--violet), var(--violet-lit));
  box-shadow: 0 0 12px rgba(192, 132, 252, .6);
  transition: width .3s linear;
}
.meta { display: flex; justify-content: space-between; font: 500 10px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.meta .time { color: var(--violet-lit); }


@media (max-width: 860px) {
  .work { grid-template-columns: 1fr; height: auto; }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); }
  .steps { flex-direction: row; }
  .step { flex: 1; }
  .canvas { min-height: 55vh; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<header class="top">
  <div class="mark">Dizrupt<span>.</span></div>
  <div class="top-sub">Try-on</div>
  <div class="top-right">
    <span class="pill" id="credits" hidden><b id="creditsVal">—</b> credits</span>
    <span class="pill"><i class="dot" id="keyDot"></i><span id="keyText">checking key</span></span>
  </div>
</header>

<main class="work">
  <aside class="rail">
    <div class="modes" role="group" aria-label="What are you trying on">
      <button type="button" data-mode="clothing" aria-pressed="true">Clothing</button>
      <button type="button" data-mode="jewellery" aria-pressed="false">Jewellery</button>
    </div>

    <ol class="steps">
      <li class="step" id="stepGarment">
        <div class="step-head"><span class="step-n">1</span><span class="step-label" id="itemLabel">Add the garment</span></div>
        <div class="drop" id="dropGarment" tabindex="0" role="button" aria-label="Add the garment image">
          <img class="thumb" id="thumbGarment" alt="">
          <span class="cue" id="itemCue">Drop, click or paste a photo of the clothing</span>
        </div>
        <button class="clear" data-clear="garment" aria-label="Remove the garment image">✕</button>
      </li>
      <li class="step" id="stepModel">
        <div class="step-head"><span class="step-n">2</span><span class="step-label">Add your photo</span></div>
        <div class="drop" id="dropModel" tabindex="0" role="button" aria-label="Add your photo">
          <img class="thumb" id="thumbModel" alt="">
          <span class="cue">Drop, click or paste a full-body photo</span>
        </div>
        <button class="clear" data-clear="model" aria-label="Remove your photo">✕</button>
      </li>
    </ol>

    <button class="run" id="run" disabled>Generate</button>
    <p class="note">A tighter box is faster and sharper.</p>
  </aside>

  <section class="stage">
    <div class="stage-bar">
      <span class="status" id="status">Ready</span>
      <div class="stage-actions">
        <button class="ghost" id="rearea" hidden>Change area</button>
        <a class="ghost" id="open" hidden target="_blank" rel="noopener">Open image ↗</a>
      </div>
    </div>

    <div class="canvas" id="canvas"></div>
  </section>
</main>

<script type="module">
const $ = (id) => document.getElementById(id)
// The model reads reference images at full fidelity, so downscaling here throws
// away exactly the fabric texture and print detail the try-on needs.
const MAX_EDGE = 2560
// Per image, as base64 characters. Two of these plus JSON stay inside the
// server's 25MB body limit with room to spare.
const MAX_UPLOAD = 8e6

const state = { model: null, garment: null, result: null, mode: 'clothing', box: null, editing: false }

const COPY = {
  clothing: {
    label: 'Add the garment',
    cue: 'Drop, click or paste a photo of the clothing',
    head: 'Put the garment on the person.',
    hint: 'Drag a box over the clothing',
    // Torso-ish: keeps the face and most of the background out of the model's reach.
    box: { x: 0.12, y: 0.18, w: 0.76, h: 0.72 },
  },
  jewellery: {
    label: 'Add the jewellery',
    cue: 'Drop, click or paste a photo of the piece',
    head: 'Put the jewellery on the person.',
    hint: 'Drag a box where the piece should sit',
    box: { x: 0.24, y: 0.12, w: 0.52, h: 0.44 },
  },
}

/* ---------- image intake ---------- */
const readAsDataURL = (file) => new Promise((resolve, reject) => {
  const r = new FileReader()
  r.onload = () => resolve(r.result)
  r.onerror = () => reject(new Error('Could not read that file'))
  r.readAsDataURL(file)
})

const shrink = (file) => new Promise((resolve, reject) => {
  // Small PNGs go through untouched so transparent flat-lays keep their alpha.
  // The threshold is deliberately low: base64 inflates by a third, and two big
  // PNGs together used to blow past the server's body limit.
  if (file.type === 'image/png' && file.size < 2e6) return resolve(readAsDataURL(file))
  const img = new Image()
  img.onload = () => {
    // Step down until the encoded string fits the budget, so a 48-megapixel
    // phone photo can never produce an unsendable payload.
    let best
    for (const [edge, quality] of [[MAX_EDGE, 0.95], [2048, 0.9], [1536, 0.85]]) {
      const scale = Math.min(1, edge / Math.max(img.width, img.height))
      const c = Object.assign(document.createElement('canvas'), {
        width: Math.round(img.width * scale),
        height: Math.round(img.height * scale),
      })
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height)
      best = c.toDataURL('image/jpeg', quality)
      if (best.length <= MAX_UPLOAD) break
    }
    URL.revokeObjectURL(img.src)
    resolve(best)
  }
  img.onerror = () => reject(new Error(`${file.name || 'That file'} is not a readable image`))
  img.src = URL.createObjectURL(file)
})

/* ---------- product cutout ---------- */
// Jewellery is shot on coloured backdrops, and the model reads a big soft pink
// rectangle as a garment. Flood-fill inwards from the edges to strip it, then
// crop to what is left so the piece fills the frame on plain white.
const cutout = async (src) => {
  const img = await loadImage(src)
  const w = img.naturalWidth
  const h = img.naturalHeight
  const c = Object.assign(document.createElement('canvas'), { width: w, height: h })
  const ctx = c.getContext('2d', { willReadFrequently: true })
  ctx.drawImage(img, 0, 0)
  const image = ctx.getImageData(0, 0, w, h)
  const px = image.data

  // Learn the backdrop's palette from the border, in a coarse 32^3 colour cube.
  // Comparing neighbours instead would walk up the anti-aliased ramp at the
  // object's edge — each step is small even though the edge itself is not.
  // 6-bit cells, not 5: a coarser cube matched gold that merely sat near the
  // backdrop's range and nibbled away the thin parts of a chain.
  const key = (p) => ((px[p] >> 2) << 12) | ((px[p + 1] >> 2) << 6) | (px[p + 2] >> 2)
  const palette = new Uint8Array(64 * 64 * 64)
  const learn = (p) => {
    const r = px[p] >> 2
    const g = px[p + 1] >> 2
    const b = px[p + 2] >> 2
    // Dilate by one cell so noise and soft gradients still register.
    for (let dr = -1; dr <= 1; dr++) {
      for (let dg = -1; dg <= 1; dg++) {
        for (let db = -1; db <= 1; db++) {
          const rr = r + dr, gg = g + dg, bb = b + db
          if (rr < 0 || rr > 63 || gg < 0 || gg > 63 || bb < 0 || bb > 63) continue
          palette[(rr << 12) | (gg << 6) | bb] = 1
        }
      }
    }
  }
  for (let x = 0; x < w; x++) { learn(x * 4); learn(((h - 1) * w + x) * 4) }
  for (let y = 0; y < h; y++) { learn(y * w * 4); learn((y * w + w - 1) * 4) }

  // Then flood inwards, but only through pixels that match that palette, so an
  // enclosed patch of backdrop colour inside the product is left alone.
  const isBg = new Uint8Array(w * h)
  const stack = []
  const seed = (i) => { if (!isBg[i] && palette[key(i * 4)]) { isBg[i] = 1; stack.push(i) } }
  for (let x = 0; x < w; x++) { seed(x); seed((h - 1) * w + x) }
  for (let y = 0; y < h; y++) { seed(y * w); seed(y * w + w - 1) }

  while (stack.length) {
    const i = stack.pop()
    const x = i % w
    const y = (i / w) | 0
    if (x > 0) seed(i - 1)
    if (x < w - 1) seed(i + 1)
    if (y > 0) seed(i - w)
    if (y < h - 1) seed(i + w)
  }

  let removed = 0
  let minX = w, minY = h, maxX = -1, maxY = -1
  for (let i = 0; i < isBg.length; i++) {
    if (isBg[i]) {
      removed++
      const p = i * 4
      px[p] = px[p + 1] = px[p + 2] = 255
      continue
    }
    const x = i % w
    const y = (i / w) | 0
    if (x < minX) minX = x
    if (x > maxX) maxX = x
    if (y < minY) minY = y
    if (y > maxY) maxY = y
  }

  // Refuse to guess when the backdrop is busy (nothing stripped) or when the
  // fill has eaten the product too. The upper bound has to be generous: a thin
  // chain on a large backdrop is legitimately 97%+ background.
  const share = removed / (w * h)
  const kept = w * h - removed
  const wideEnough = maxX - minX > w * 0.02 && maxY - minY > h * 0.02
  if (share < 0.15 || share > 0.9995 || kept < 200 || !wideEnough || maxX < 0) return src

  const margin = Math.round(Math.max(maxX - minX, maxY - minY) * 0.04)
  const sx = Math.max(0, minX - margin)
  const sy = Math.max(0, minY - margin)
  const sw = Math.min(w - sx, maxX - minX + 1 + margin * 2)
  const sh = Math.min(h - sy, maxY - minY + 1 + margin * 2)

  // Flat: backdrop painted white, for a provider that would render alpha black.
  ctx.putImageData(image, 0, 0)
  const flatC = Object.assign(document.createElement('canvas'), { width: sw, height: sh })
  const f = flatC.getContext('2d')
  f.fillStyle = '#fff'
  f.fillRect(0, 0, sw, sh)
  f.drawImage(c, sx, sy, sw, sh, 0, 0, sw, sh)

  // Cut: backdrop knocked out, for compositing the real product onto a photo.
  for (let i = 0; i < isBg.length; i++) if (isBg[i]) px[i * 4 + 3] = 0
  ctx.putImageData(image, 0, 0)
  const cutC = Object.assign(document.createElement('canvas'), { width: sw, height: sh })
  cutC.getContext('2d').drawImage(c, sx, sy, sw, sh, 0, 0, sw, sh)

  return { flat: flatC.toDataURL('image/jpeg', 0.95), cut: cutC.toDataURL('image/png') }
}

// The photo is never regenerated: it is drawn as-is and the product is placed
// on top, so proportions, face and background are the originals by definition.
const overlay = async (photoSrc, pieceSrc, box) => {
  const [base, piece] = await Promise.all([loadImage(photoSrc), loadImage(pieceSrc)])
  const W = base.naturalWidth
  const H = base.naturalHeight
  const out = Object.assign(document.createElement('canvas'), { width: W, height: H })
  const ctx = out.getContext('2d')
  ctx.drawImage(base, 0, 0)

  const bw = box.w * W
  const bh = box.h * H
  const scale = Math.min(bw / piece.naturalWidth, bh / piece.naturalHeight)
  const pw = piece.naturalWidth * scale
  const ph = piece.naturalHeight * scale
  const px = box.x * W + (bw - pw) / 2
  const py = box.y * H + (bh - ph) / 2

  // A whisper of shadow stops it reading as a sticker.
  ctx.shadowColor = 'rgba(0, 0, 0, .35)'
  ctx.shadowBlur = Math.max(2, ph * 0.02)
  ctx.shadowOffsetY = Math.max(1, ph * 0.008)
  ctx.drawImage(piece, px, py, pw, ph)
  return out.toDataURL('image/png')
}

// The cutout depends on the mode, so keep the original around to redo it from.
async function refreshGarment() {
  if (!state.garmentRaw) {
    state.garment = null
    state.piece = null
    $('thumbGarment').src = ''
    return
  }
  if (state.mode !== 'jewellery') {
    state.garment = state.garmentRaw
    state.piece = null
  } else {
    const cut = await cutout(state.garmentRaw)
    // A string back means the backdrop was too busy to strip safely.
    state.garment = typeof cut === 'string' ? cut : cut.flat
    state.piece = typeof cut === 'string' ? null : cut.cut
  }
  $('thumbGarment').src = state.garment
  syncRun()
}

/* ---------- crop out, paste back ---------- */
// The model repaints whatever it is shown, so it is only shown the region that
// should change. Everything outside the box stays as the original pixels.
const loadImage = (src) => new Promise((resolve, reject) => {
  const img = new Image()
  img.onload = () => resolve(img)
  img.onerror = () => reject(new Error('Could not read that image'))
  img.src = src
})

const cropToBox = async (src, box) => {
  const img = await loadImage(src)
  const sw = Math.max(32, Math.round(box.w * img.naturalWidth))
  const sh = Math.max(32, Math.round(box.h * img.naturalHeight))
  const c = Object.assign(document.createElement('canvas'), { width: sw, height: sh })
  c.getContext('2d').drawImage(
    img,
    Math.round(box.x * img.naturalWidth), Math.round(box.y * img.naturalHeight), sw, sh,
    0, 0, sw, sh,
  )
  return c.toDataURL('image/jpeg', 0.95)
}

const pasteBack = async (originalSrc, patchSrc, box) => {
  const [base, patch] = await Promise.all([loadImage(originalSrc), loadImage(patchSrc)])
  const W = base.naturalWidth
  const H = base.naturalHeight
  const out = Object.assign(document.createElement('canvas'), { width: W, height: H })
  const ctx = out.getContext('2d')
  ctx.drawImage(base, 0, 0)

  const dx = Math.round(box.x * W)
  const dy = Math.round(box.y * H)
  const dw = Math.round(box.w * W)
  const dh = Math.round(box.h * H)

  const tmp = Object.assign(document.createElement('canvas'), { width: dw, height: dh })
  const t = tmp.getContext('2d', { willReadFrequently: true })
  t.drawImage(patch, 0, 0, dw, dh)

  // The model hands back the region at its own exposure, so the patch sits at a
  // different tone to the photo around it and reads as a visible rectangle.
  // Measure both along a ring just inside the edge and shift the patch to match.
  const ring = Math.max(2, Math.round(Math.min(dw, dh) * 0.08))
  const patchData = t.getImageData(0, 0, dw, dh)
  const baseData = ctx.getImageData(dx, dy, dw, dh)
  const sums = [0, 0, 0, 0, 0, 0]
  let n = 0
  for (let y = 0; y < dh; y++) {
    const edgeRow = y < ring || y >= dh - ring
    for (let x = 0; x < dw; x++) {
      if (!edgeRow && x >= ring && x < dw - ring) continue
      const i = (y * dw + x) * 4
      sums[0] += patchData.data[i]; sums[1] += patchData.data[i + 1]; sums[2] += patchData.data[i + 2]
      sums[3] += baseData.data[i]; sums[4] += baseData.data[i + 1]; sums[5] += baseData.data[i + 2]
      n++
    }
  }
  if (n) {
    const shift = [sums[3] / n - sums[0] / n, sums[4] / n - sums[1] / n, sums[5] / n - sums[2] / n]
    for (let i = 0; i < patchData.data.length; i += 4) {
      patchData.data[i] += shift[0]
      patchData.data[i + 1] += shift[1]
      patchData.data[i + 2] += shift[2]
    }
    t.putImageData(patchData, 0, 0)
  }

  // Then soften the join: a blurred solid rect as an alpha mask feathers all
  // four edges at once, so no hard boundary survives either.
  const feather = Math.max(3, Math.round(Math.min(dw, dh) * 0.1))
  t.globalCompositeOperation = 'destination-in'
  t.filter = `blur(${feather}px)`
  t.fillStyle = '#fff'
  t.fillRect(feather, feather, dw - 2 * feather, dh - 2 * feather)

  ctx.drawImage(tmp, dx, dy)
  return out.toDataURL('image/png')
}

function setSlot(which, value) {
  state[which] = value
  const drop = $(which === 'model' ? 'dropModel' : 'dropGarment')
  const thumb = $(which === 'model' ? 'thumbModel' : 'thumbGarment')
  thumb.src = value || ''
  drop.classList.toggle('filled', Boolean(value))
  if (which === 'garment') {
    state.garmentRaw = value
    refreshGarment()
  }
  $(which === 'model' ? 'stepModel' : 'stepGarment').classList.toggle('done', Boolean(value))
  // A new photo invalidates whatever region was picked on the old one.
  if (which === 'model') {
    state.box = value ? { ...COPY[state.mode].box } : null
    state.result = null
    state.editing = false
  }
  syncRun()
  renderStage()
}

async function takeFile(which, file) {
  if (!file || !file.type.startsWith('image/')) return
  try {
    setSlot(which, await shrink(file))
    hideAlert()
  } catch (e) {
    showAlert(e.message)
  }
}

for (const [which, dropId] of [['garment', 'dropGarment'], ['model', 'dropModel']]) {
  const drop = $(dropId)
  const pick = Object.assign(document.createElement('input'), { type: 'file', accept: 'image/*' })
  pick.onchange = () => takeFile(which, pick.files[0])
  drop.addEventListener('click', () => pick.click())
  drop.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick.click() } })
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over') })
  drop.addEventListener('dragleave', () => drop.classList.remove('over'))
  drop.addEventListener('drop', (e) => {
    e.preventDefault()
    drop.classList.remove('over')
    takeFile(which, e.dataTransfer.files[0])
  })
}

document.querySelectorAll('[data-clear]').forEach((btn) =>
  btn.addEventListener('click', () => setSlot(btn.dataset.clear, null)))

/* ---------- clothing / jewellery ---------- */
document.querySelectorAll('[data-mode]').forEach((btn) =>
  btn.addEventListener('click', () => {
    state.mode = btn.dataset.mode
    document.querySelectorAll('[data-mode]').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)))
    const copy = COPY[state.mode]
    $('itemLabel').textContent = copy.label
    $('itemCue').textContent = copy.cue
    $('dropGarment').setAttribute('aria-label', copy.label)
    // A necklace and a dress want very different regions, so reset the box.
    if (state.model) state.box = { ...copy.box }
    refreshGarment() // cutout only applies in jewellery mode
    renderStage()
  }))

// Paste an image, or an image URL, into whichever step is still empty.
window.addEventListener('paste', (e) => {
  const which = state.garment ? (state.model ? null : 'model') : 'garment'
  if (!which) return
  const file = [...e.clipboardData.files][0]
  if (file) return takeFile(which, file)
  const text = e.clipboardData.getData('text').trim()
  if (/^https?:\/\//.test(text)) setSlot(which, text)
})

/* ---------- generate ---------- */
const syncRun = () => {
  const btn = $('run')
  if (btn.dataset.busy) return
  btn.disabled = !(state.model && state.garment)
  btn.textContent = state.result ? 'Generate again' : 'Generate'
}

// Failures share the status line rather than a banner that outlives the problem.
const showAlert = (message) => {
  $('status').className = 'status bad'
  $('status').textContent = message
}
const hideAlert = () => {
  $('status').className = 'status'
  if ($('status').textContent !== 'Ready') $('status').textContent = 'Ready'
}

const call = async (path, body) => {
  const res = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: { 'content-type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  })
  const data = await res.json().catch(() => ({ error: 'BadResponse', message: `HTTP ${res.status}` }))
  if (!res.ok || (typeof data.error === 'string' && data.error)) {
    throw new Error(data.message || data.error || `HTTP ${res.status}`)
  }
  return data
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms))

$('run').addEventListener('click', async () => {
  hideAlert()
  const btn = $('run')
  btn.dataset.busy = '1'
  btn.disabled = true
  btn.textContent = 'Working…'
  $('open').hidden = true
  const started = Date.now()
  let phase = 'generating'
  paintWorking(phase, 0)
  const tick = setInterval(() => {
    const elapsed = Date.now() - started
    $('status').innerHTML = `<b>${phase}</b> · ${(elapsed / 1000).toFixed(0)}s`
    paintWorking(phase, elapsed)
  }, 200)

  try {
    // Jewellery never goes to a model: the piece is placed on the untouched
    // photo, so the result is the original image plus the real product.
    if (state.mode === 'jewellery') {
      if (!state.piece) {
        throw new Error('Could not separate the piece from its backdrop. Use a product shot on a plain background.')
      }
      state.result = await overlay(state.model, state.piece, state.box)
      state.editing = false
      show(state.result)
      $('status').innerHTML = `<b>done</b> · ${((Date.now() - started) / 1000).toFixed(1)}s`
      return
    }

    // Send only the selected region, so the face and background are never at risk.
    const region = await cropToBox(state.model, state.box)
    const started_ = await call('/api/run', {
      mode: state.mode,
      inputs: { model_image: region, garment_image: state.garment },
    })

    // Some providers answer straight away; others hand back an id to poll.
    let output = started_.status === 'completed' ? (started_.output || [])[0] : null
    while (!output) {
      await sleep(1500)
      const res = await call(`/api/status/${started_.id}`)
      phase = res.status
      if (res.status === 'completed') { output = (res.output || [])[0]; break }
      if (res.status === 'failed') throw new Error(res.error?.message || 'The try-on failed')
    }
    if (!output) throw new Error('Finished without an image — try a different photo')

    state.result = await pasteBack(state.model, output, state.box)
    state.editing = false
    show(state.result)
    $('status').innerHTML = `<b>done</b> · ${((Date.now() - started) / 1000).toFixed(1)}s`
    loadCredits()
  } catch (e) {
    renderStage()
    showAlert(e.message) // after renderStage, which would otherwise clear it
  } finally {
    clearInterval(tick)
    delete btn.dataset.busy
    syncRun()
  }
})

/* ---------- stage ---------- */
/* ---------- what the stage shows ---------- */
function renderStage() {
  if (state.result && !state.editing) return show(state.result)
  if (state.model) return showSelector()
  $('canvas').replaceChildren(emptyState())
  $('rearea').hidden = true
  $('open').hidden = true
}

function showSelector() {
  const wrap = document.createElement('div')
  wrap.className = 'select'
  wrap.innerHTML = `<img alt="Your photo" draggable="false"><div class="sel-box"></div><div class="sel-hint"></div>`
  const img = wrap.querySelector('img')
  const rect = wrap.querySelector('.sel-box')
  wrap.querySelector('.sel-hint').textContent = COPY[state.mode].hint
  img.onload = () => { wrap.style.aspectRatio = `${img.naturalWidth} / ${img.naturalHeight}` }
  img.src = state.model

  const paint = () => {
    const b = state.box
    rect.style.left = `${b.x * 100}%`
    rect.style.top = `${b.y * 100}%`
    rect.style.width = `${b.w * 100}%`
    rect.style.height = `${b.h * 100}%`
  }
  paint()

  let start = null
  let previous = null
  const at = (e) => {
    const r = wrap.getBoundingClientRect()
    return {
      x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
      y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)),
    }
  }
  const finish = () => {
    if (!start) return
    start = null
    // A flick too small to be deliberate restores what was there before,
    // rather than snapping to a default the user did not ask for.
    if (state.box.w < 0.04 || state.box.h < 0.04) {
      state.box = previous
      paint()
    }
  }

  wrap.addEventListener('pointerdown', (e) => {
    e.preventDefault() // stops text/image drag from hijacking the gesture
    wrap.setPointerCapture(e.pointerId)
    previous = { ...state.box }
    start = at(e)
  })
  wrap.addEventListener('pointermove', (e) => {
    if (!start) return
    // If a pointerup was missed (released off-window, capture lost), the box
    // would otherwise keep following the cursor with no button held.
    if (e.buttons === 0) return finish()
    const p = at(e)
    state.box = {
      x: Math.min(start.x, p.x), y: Math.min(start.y, p.y),
      w: Math.abs(p.x - start.x), h: Math.abs(p.y - start.y),
    }
    paint()
  })
  wrap.addEventListener('pointerup', finish)
  wrap.addEventListener('pointercancel', finish)
  wrap.addEventListener('lostpointercapture', finish)

  $('canvas').replaceChildren(wrap)
  $('rearea').hidden = true
  $('open').hidden = !state.result
}

function emptyState() {
  const el = document.createElement('div')
  el.className = 'empty'
  el.innerHTML = `<div class="empty-seam"></div><h2></h2>
    <p>Add the two photos, then press Generate.</p>`
  el.querySelector('h2').textContent = COPY[state.mode].head
  return el
}

// Neither provider reports real progress — OpenAI is one blocking call, FASHN
// gives phases but no percentage. So this is an elapsed-time curve that eases
// toward 100% and never claims to be finished. ~63% at 45s, ~95% at 135s.
function paintWorking(phase, elapsed) {
  let box = $('canvas').querySelector('.working')
  if (!box) {
    box = document.createElement('div')
    box.className = 'working'
    box.innerHTML = `<div class="prog">
      <div class="track"><div class="fill"></div></div>
      <div class="meta"><span class="phase"></span><span class="time"></span></div>
    </div>`
    $('canvas').replaceChildren(box)
  }
  box.querySelector('.fill').style.width = `${(100 * (1 - Math.exp(-elapsed / 45000))).toFixed(1)}%`
  box.querySelector('.phase').textContent = phase.replace('_', ' ')
  box.querySelector('.time').textContent = `${Math.round(elapsed / 1000)}s`
}

function show(url) {
  const box = document.createElement('div')
  box.className = 'compare'
  box.innerHTML = `<img class="after" alt="Try-on result"><img class="before" alt="Your original photo">
    <div class="seam"><span class="grip"></span></div>
    <span class="tag l">Before</span><span class="tag r">After</span>`
  const after = box.querySelector('.after')
  after.src = url
  box.querySelector('.before').src = state.model
  after.onload = () => { box.style.aspectRatio = `${after.naturalWidth} / ${after.naturalHeight}` }

  const at = (clientX) => {
    const r = box.getBoundingClientRect()
    box.style.setProperty('--x', `${Math.min(100, Math.max(0, ((clientX - r.left) / r.width) * 100)).toFixed(2)}%`)
  }
  box.addEventListener('pointerdown', (e) => { box.setPointerCapture(e.pointerId); at(e.clientX) })
  box.addEventListener('pointermove', (e) => { if (box.hasPointerCapture(e.pointerId)) at(e.clientX) })

  $('canvas').replaceChildren(box)
  $('rearea').hidden = false
  $('open').hidden = false
  // Chrome blocks top-level navigation to data: URLs, and every result is one
  // now, so hand the link a blob instead.
  fetch(url).then((r) => r.blob()).then((blob) => {
    if (openUrl) URL.revokeObjectURL(openUrl)
    openUrl = URL.createObjectURL(blob)
    $('open').href = openUrl
  })
}
let openUrl = null

/* ---------- key + credits ---------- */
const findNumber = (v) => {
  if (typeof v === 'number') return v
  if (v && typeof v === 'object') for (const x of Object.values(v)) { const n = findNumber(x); if (n !== null) return n }
  return null
}

async function loadCredits() {
  const { ok, provider } = await call('/api/_key').catch(() => ({ ok: false }))
  $('keyDot').className = ok ? 'dot ok' : 'dot bad'
  $('keyText').textContent = ok ? 'ready' : 'no API key'
  if (!ok) {
    showAlert('Not configured — add the API key on the server, then restart it.')
    return
  }
  // Only one provider reports a balance, and it is a nicety, not a health check.
  if (provider !== 'fashn') return
  const n = findNumber(await call('/api/credits').catch(() => null))
  $('credits').hidden = n === null
  if (n !== null) $('creditsVal').textContent = n.toLocaleString()
}

$('rearea').addEventListener('click', () => { state.editing = true; renderStage() })

renderStage()
loadCredits()
syncRun()
</script>
</body>
</html>
